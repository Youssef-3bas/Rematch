name: Deploy Rematch API to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/AZURE_CONTAINER_APPS.md'
      - '.github/workflows/rematch-api-AutoDeployTrigger-a3fce886-ff6a-4c0e-8c2f-a81b4b50f027.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Manual runs from other branches must not deploy an unreviewed image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      REGISTRY_URL: ${{ vars.REMATCHAPI_REGISTRY_URL }}

    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend tests
        run: |
          python -m pip install --disable-pip-version-check -e "backend[dev]"
          python -m pytest backend/tests -q

      - name: Verify deployment source and required credentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          AZURE_CLIENT_ID: ${{ secrets.REMATCHAPI_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.REMATCHAPI_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.REMATCHAPI_AZURE_SUBSCRIPTION_ID }}
          REGISTRY_URL: ${{ vars.REMATCHAPI_REGISTRY_URL }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checkout does not match the triggering commit."
            exit 1
          fi
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID REGISTRY_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret or variable is missing: $name (value not displayed)."
              exit 1
            fi
          done
          REGISTRY_URL="$(printf '%s' "$REGISTRY_URL" | xargs)"
          printf 'REGISTRY_URL=%s\n' "$REGISTRY_URL" >> "$GITHUB_ENV"
          printf 'IMAGE=%s/rematch-api:%s\n' "$REGISTRY_URL" "$EXPECTED_SHA" >> "$GITHUB_ENV"

          if [[ "$REGISTRY_URL" != "rematchbackend.azurecr.io" ]]; then
            echo "::error::Registry URL mismatch."
            printf 'Expected registry: <%s>\n' "rematchbackend.azurecr.io"
            printf 'Received registry: <%s>\n' "$REGISTRY_URL"
            exit 1
          fi
          test -f backend/Dockerfile || { echo "::error::backend/Dockerfile is missing."; exit 1; }
          test -f backend/containerapp.yaml || { echo "::error::backend/containerapp.yaml is missing."; exit 1; }
          test -f backend/scripts/verify_container_port.py || { echo "::error::Container port verifier is missing."; exit 1; }

      - name: Check configured container and ingress ports
        run: python backend/scripts/verify_container_port.py

      - name: Build backend image and verify its effective listener
        shell: bash
        run: |
          set -euo pipefail
          docker build --file backend/Dockerfile --tag "rematch-port-check:${GITHUB_SHA}" backend
          container_name="rematch-port-check-${GITHUB_RUN_ID}"
          cleanup() { docker rm --force "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container_name" \
            --env PORT=8000 \
            --publish 127.0.0.1:18000:8000 \
            "rematch-port-check:${GITHUB_SHA}" >/dev/null
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:18000/health/startup >/dev/null; then
              echo "Container startup probe passed through the 8000-to-8000 port mapping."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not serve /health/startup on configured port 8000."
          exit 1

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.REMATCHAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.REMATCHAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.REMATCHAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Diagnose Azure login context
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Active Azure account ==="
          az account show \
            --query "{subscriptionName:name, subscriptionId:id, tenantId:tenantId, userType:user.type}" \
            --output json
          echo "=== Locate registry in active subscription ==="
          az acr list \
            --query "[?name=='rematchbackend'].{name:name,resourceGroup:resourceGroup,loginServer:loginServer}" \
            --output json
          echo "=== Check expected resource group ==="
          az group show --name Rematch-RG \
            --query "{name:name,location:location}" \
            --output json

      - name: Install the Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Verify existing resource group, ACR, and Container App ingress
        shell: bash
        run: |
          set -euo pipefail
          expected_registry="$REGISTRY_URL"
          az group show --name Rematch-RG --output none --only-show-errors || {
            echo "::error::Existing resource group Rematch-RG was not found or is not readable."
            exit 1
          }
          acr_server="$(az acr show --name rematchbackend --query loginServer --output tsv --only-show-errors)" || {
            echo "::error::Azure Container Registry rematchbackend is unavailable to this Azure identity."
            exit 1
          }
          if [[ "$acr_server" != "$expected_registry" ]]; then
            echo "::error::The configured registry URL does not match the existing ACR login server."
            exit 1
          fi
          acr_id="$(az acr show --name rematchbackend --query id --output tsv --only-show-errors)"
          acr_json="$(mktemp)"
          trap 'rm -f "$acr_json"' EXIT
          az acr show --name rematchbackend --output json --only-show-errors > "$acr_json"
          pull_role="$(python backend/scripts/verify_aca_deployment.py acr-role "$acr_json")" || exit 1
          app_id="$(az containerapp show --name rematch-api --resource-group Rematch-RG --query id --output tsv --only-show-errors)" || {
            echo "::error::Existing Container App rematch-api in Rematch-RG was not found or is not readable."
            exit 1
          }
          app_name="$(az containerapp show --name rematch-api --resource-group Rematch-RG --query name --output tsv --only-show-errors)"
          app_group="$(az containerapp show --name rematch-api --resource-group Rematch-RG --query resourceGroup --output tsv --only-show-errors)"
          target_port="$(az containerapp show --name rematch-api --resource-group Rematch-RG --query properties.configuration.ingress.targetPort --output tsv --only-show-errors)"
          if [[ "$app_name" != "rematch-api" || "$app_group" != "Rematch-RG" ]]; then
            echo "::error::Azure returned a different Container App or resource group than configured."
            exit 1
          fi
          if [[ "$target_port" != "8000" ]]; then
            echo "::error::Existing Container App ingress targetPort must be 8000; refusing to deploy."
            exit 1
          fi
          echo "Existing resource group, ACR authorization mode ($pull_role), Container App, and ingress port verified."

      - name: Authenticate Docker to ACR with the Azure OIDC identity
        run: az acr login --name rematchbackend --only-show-errors

      - name: Build and push backend Docker image for this commit
        shell: bash
        run: |
          set -euo pipefail
          expected_image="${REGISTRY_URL}/rematch-api:${GITHUB_SHA}"
          if [[ "$IMAGE" != "$expected_image" ]]; then
            echo "::error::Build image does not match the triggering commit SHA or configured registry."
            exit 1
          fi
          docker build --file backend/Dockerfile --tag "$IMAGE" backend
          if ! docker push "$IMAGE"; then
            echo "::error::Image push failed. Confirm the GitHub OIDC deployment identity has AcrPush on a standard RBAC ACR, or repository-scoped Container Registry Repository Writer on an ABAC ACR."
            exit 1
          fi

      - name: Configure and verify Container App ACR managed identity
        shell: bash
        run: |
          set -euo pipefail
          # Configure before validating: the previous workflow only checked for
          # credentials and failed before ever creating the identity binding.
          az containerapp identity assign \
            --name rematch-api \
            --resource-group Rematch-RG \
            --system-assigned \
            --output none \
            --only-show-errors
          az containerapp registry set \
            --name rematch-api \
            --resource-group Rematch-RG \
            --server "$REGISTRY_URL" \
            --identity system \
            --only-show-errors >/dev/null

          acr_json="$(mktemp)"
          app_json="$(mktemp)"
          roles_json="$(mktemp)"
          trap 'rm -f "$acr_json" "$app_json" "$roles_json"' EXIT
          az acr show --name rematchbackend --output json --only-show-errors > "$acr_json"
          pull_role="$(python backend/scripts/verify_aca_deployment.py acr-role "$acr_json")" || exit 1
          az containerapp show --name rematch-api --resource-group Rematch-RG --output json --only-show-errors > "$app_json"
          pull_principal="$(python backend/scripts/verify_aca_deployment.py verify-registry "$app_json" --server "$REGISTRY_URL")" || {
            echo "::error::The live Container App registry configuration does not use its system-assigned identity."
            exit 1
          }
          acr_id="$(az acr show --name rematchbackend --query id --output tsv --only-show-errors)"
          az role assignment list --scope "$acr_id" --include-inherited --output json --only-show-errors > "$roles_json" || {
            echo "::error::Unable to inspect image-pull role assignments on the existing ACR."
            exit 1
          }
          python backend/scripts/verify_aca_deployment.py verify-role "$roles_json" \
            --principal-id "$pull_principal" --role-name "$pull_role" || {
              echo "::error::Assign $pull_role to the Container App system identity at the existing ACR scope, then rerun."
              exit 1
            }
          echo "Container App system identity, ACR registry binding, and pull role verified."

      - name: Deploy the exact pushed image and normalize the app container name
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_image="${REGISTRY_URL}/rematch-api:$EXPECTED_SHA"
          if [[ "$IMAGE" != "$expected_image" ]]; then
            echo "::error::Deployment image does not match the triggering commit SHA."
            exit 1
          fi
          if ! az acr repository show-tags --name rematchbackend --repository rematch-api --output tsv --only-show-errors | grep -Fxq "$EXPECTED_SHA"; then
            echo "::error::The exact commit image tag was not found in the existing ACR after push."
            exit 1
          fi

          app_json="$(mktemp)"
          patch_json="$(mktemp)"
          update_error="$(mktemp)"
          trap 'rm -f "$app_json" "$patch_json" "$update_error"' EXIT
          az containerapp show --name rematch-api --resource-group Rematch-RG --output json --only-show-errors > "$app_json"
          previous_revision="$(az containerapp show --name rematch-api --resource-group Rematch-RG --query properties.latestRevisionName --output tsv --only-show-errors)"
          app_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$app_json")"
          python backend/scripts/verify_aca_deployment.py template-patch "$app_json" --image "$IMAGE" --output "$patch_json"
          # Azure's Container Apps PATCH endpoint accepts application/json and
          # applies the partial template update without replacing app config.
          if ! az rest --method patch \
            --uri "https://management.azure.com${app_id}?api-version=2025-07-01" \
            --headers Content-Type=application/json \
            --body "@$patch_json" \
            --output none \
            --only-show-errors 2>"$update_error"; then
            error_code="$(python -c 'import re,sys; text=open(sys.argv[1], encoding="utf-8", errors="replace").read(); match=re.search(r"\(([A-Za-z][A-Za-z0-9_-]{0,63})\)", text); print(match.group(1) if match else "unavailable")' "$update_error")"
            echo "::error::Azure rejected the Container App update (error code: ${error_code}). Review the Azure Activity Log for rematch-api in Rematch-RG; response details were withheld."
            exit 1
          fi

          latest_revision=""
          for attempt in $(seq 1 60); do
            latest_revision="$(az containerapp show --name rematch-api --resource-group Rematch-RG --query properties.latestRevisionName --output tsv --only-show-errors)"
            if [[ -n "$latest_revision" && "$latest_revision" != "None" && "$latest_revision" != "$previous_revision" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$latest_revision" || "$latest_revision" == "None" || "$latest_revision" == "$previous_revision" ]]; then
            echo "::error::Azure did not create a new latest revision after the image update."
            exit 1
          fi

          revision_json="$(mktemp)"
          trap 'rm -f "$app_json" "$patch_json" "$update_error" "$revision_json"' EXIT
          revision_ready=false
          for attempt in $(seq 1 60); do
            az containerapp revision show --name rematch-api --resource-group Rematch-RG --revision "$latest_revision" --output json --only-show-errors > "$revision_json"
            if python backend/scripts/verify_aca_deployment.py verify-revision "$revision_json" --image "$IMAGE"; then
              revision_ready=true
              break
            fi
            sleep 10
          done
          if [[ "$revision_ready" != true ]]; then
            replicas_json="$(mktemp)"
            system_logs_json="$(mktemp)"
            console_logs_json="$(mktemp)"
            revision_error="$(mktemp)"
            replica_error="$(mktemp)"
            system_log_error="$(mktemp)"
            console_log_error="$(mktemp)"
            trap 'rm -f "$app_json" "$patch_json" "$update_error" "$response_file" "$headers_file" "$revision_json" "$replicas_json" "$system_logs_json" "$console_logs_json" "$revision_error" "$replica_error" "$system_log_error" "$console_log_error"' EXIT

            if ! az containerapp revision show --name rematch-api --resource-group Rematch-RG --revision "$latest_revision" --output json --only-show-errors > "$revision_json" 2>"$revision_error"; then
              printf '{}\n' > "$revision_json"
            fi
            if ! az containerapp replica list --name rematch-api --resource-group Rematch-RG --revision "$latest_revision" --output json --only-show-errors > "$replicas_json" 2>"$replica_error"; then
              printf '{}\n' > "$replicas_json"
            fi
            if ! az containerapp logs show --name rematch-api --resource-group Rematch-RG --type system --revision "$latest_revision" --tail 50 --format json --output json --only-show-errors > "$system_logs_json" 2>"$system_log_error"; then
              printf '{}\n' > "$system_logs_json"
            fi
            if ! az containerapp logs show --name rematch-api --resource-group Rematch-RG --type console --revision "$latest_revision" --container rematch-api --tail 50 --format json --output json --only-show-errors > "$console_logs_json" 2>"$console_log_error"; then
              printf '{}\n' > "$console_logs_json"
            fi
            revision_diagnostic="$(python backend/scripts/verify_aca_deployment.py revision-diagnostic \
              "$revision_json" "$replicas_json" "$system_logs_json" "$console_logs_json" \
              --image "$IMAGE" \
              --revision-error "$(cat "$revision_error")" \
              --replica-error "$(cat "$replica_error")" \
              --system-log-error "$(cat "$system_log_error")" \
              --console-log-error "$(cat "$console_log_error")")"
            echo "::error::Latest revision did not become Healthy, Running, and Provisioned with the exact SHA image. Revision failure diagnostics (sensitive values redacted): ${revision_diagnostic}"
            exit 1
          fi
          echo "Verified revision ${latest_revision}: healthy, running, provisioned, and using the expected SHA image."

          fqdn="$(az containerapp show --name rematch-api --resource-group Rematch-RG --query properties.configuration.ingress.fqdn --output tsv --only-show-errors)"
          if [[ -z "$fqdn" || "$fqdn" == "None" ]]; then
            echo "::error::The existing Container App has no public ingress FQDN to smoke-test."
            exit 1
          fi
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          request_error="$(mktemp)"
          trap 'rm -f "$app_json" "$patch_json" "$update_error" "$revision_json" "$response_file" "$headers_file" "$request_error"' EXIT

          request_status() {
            local url="$1"
            : > "$response_file"
            : > "$request_error"
            : > "$headers_file"
            curl --silent --show-error --connect-timeout 10 --max-time 15 \
              --dump-header "$headers_file" --output "$response_file" \
              --write-out '%{http_code}' "$url" 2>"$request_error" || true
          }
          report_http_failure() {
            local label="$1"
            local response_status="$2"
            local diagnostic
            diagnostic="$(python backend/scripts/verify_aca_deployment.py http-diagnostic \
              "$response_status" "$response_file" "$request_error")"
            echo "::error::${label} failed after bounded retries: ${diagnostic}"
          }

          for probe in live ready; do
            if [[ "$probe" == "live" ]]; then expected_check="liveness"; else expected_check="readiness"; fi
            probe_status=""
            for attempt in $(seq 1 6); do
              probe_status="$(request_status "https://${fqdn}/health/${probe}")"
              if [[ "$probe_status" == "200" ]] && python backend/scripts/verify_aca_deployment.py verify-health-response "$response_file" --check "$expected_check"; then break; fi
              sleep 5
            done
            if [[ "$probe_status" != "200" ]] || ! python backend/scripts/verify_aca_deployment.py verify-health-response "$response_file" --check "$expected_check"; then
              report_http_failure "Public /health/${probe} check" "$probe_status"
              exit 1
            fi
            echo "Public /health/${probe} returned HTTP 200 with the expected ${expected_check} response."
          done

          openapi_status=""
          for attempt in $(seq 1 6); do
            openapi_status="$(request_status "https://${fqdn}/openapi.json")"
            if [[ "$openapi_status" == "200" ]] && python backend/scripts/verify_aca_deployment.py verify-openapi-response "$response_file"; then break; fi
            sleep 5
          done
          if [[ "$openapi_status" != "200" ]] || ! python backend/scripts/verify_aca_deployment.py verify-openapi-response "$response_file"; then
            report_http_failure "Public /openapi.json check" "$openapi_status"
            exit 1
          fi
          echo "Public /openapi.json returned HTTP 200 with a valid OpenAPI document."

          auth_status=""
          for attempt in $(seq 1 6); do
            auth_status="$(request_status "https://${fqdn}/api/v1/health")"
            if [[ "$auth_status" == "401" ]] && grep --ignore-case --quiet '^www-authenticate:[[:space:]]*Bearer' "$headers_file"; then break; fi
            sleep 5
          done
          if [[ "$auth_status" != "401" ]] || ! grep --ignore-case --quiet '^www-authenticate:[[:space:]]*Bearer' "$headers_file"; then
            report_http_failure "Unauthenticated public /api/v1/health check (expected HTTP 401 with Bearer challenge)" "$auth_status"
            exit 1
          fi
          echo "Unauthenticated /api/v1/health returned HTTP 401 with a Bearer challenge."
          echo "Latest revision uses the exact SHA image and is healthy; public liveness, readiness, OpenAPI, and API authentication checks passed."
