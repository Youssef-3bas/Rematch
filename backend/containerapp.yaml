properties:
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8000
      allowInsecure: false
      transport: auto
      traffic:
        - latestRevision: true
          weight: 100
  template:
    scale:
      minReplicas: 0
      maxReplicas: 1
    containers:
      - name: rematch-api
        image: REPLACE_WITH_REGISTRY/rematch-backend:REPLACE_WITH_TAG
        env:
          - name: APP_ENV
            value: production
          - name: REQUIRE_API_AUTH
            value: "true"
          - name: API_BEARER_TOKEN
            secretRef: api-bearer-token
          - name: DATABASE_URL
            value: sqlite:////tmp/rematch/rematch.db
          - name: PORT
            value: "8000"
          - name: CORS_ORIGINS
            value: ""
        resources:
          cpu: 0.5
          memory: 1Gi
        probes:
          - type: Startup
            httpGet:
              path: /health/startup
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10
          - type: Liveness
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
